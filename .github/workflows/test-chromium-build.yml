
name: Test Chromium build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chromium package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download uAssets
        run: bash tools/pull-assets.sh

      - name: Build Chromium package
        run: bash tools/make-chromium.sh all

      - name: Verify output
        run: test -s dist/build/uBlock0.chromium.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ublock-chromium-test
          path: dist/build/uBlock0.chromium.zip
          if-no-files-found: error
          retention-days: 7
