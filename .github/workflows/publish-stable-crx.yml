
name: Publish stable Chromium CRX

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: publish-stable-crx
  cancel-in-progress: false

jobs:

  prepare:
    name: Check latest stable release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JSON="$(gh api repos/gorhill/uBlock/releases/latest)"

          TAG="$(jq -r '.tag_name' <<< "$JSON")"
          PRERELEASE="$(jq -r '.prerelease' <<< "$JSON")"
          DRAFT="$(jq -r '.draft' <<< "$JSON")"

          if [[ "$PRERELEASE" != "false" || "$DRAFT" != "false" ]]; then
            echo "::error::Upstream release is not stable."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected version tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          RELEASE_TAG="uBlock-${VERSION}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already published."

          else

            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New stable release: $VERSION"

          fi

  build:
    name: Build official upstream source
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download exact upstream source
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/gorhill/uBlock.git upstream

          VERSION="$(tr -d '\r\n' < upstream/dist/version)"

          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Upstream version mismatch."
            exit 1
          fi

          SOURCE_SHA="$(git -C upstream rev-parse HEAD)"

          echo "Source version: $VERSION"
          echo "Source commit: $SOURCE_SHA"

          echo "$VERSION" > "$RUNNER_TEMP/version.txt"
          echo "$SOURCE_SHA" > "$RUNNER_TEMP/source-sha.txt"

      - name: Download uAssets
        working-directory: upstream
        run: bash tools/pull-assets.sh

      - name: Build Chromium package
        working-directory: upstream
        run: bash tools/make-chromium.sh all

      - name: Verify build files
        run: |
          set -euo pipefail

          test -s upstream/dist/build/uBlock0.chromium/manifest.json
          test -s upstream/dist/build/uBlock0.chromium.zip

      - name: Prepare build artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ublock-artifact"

          tar -czf "$RUNNER_TEMP/ublock-artifact/extension.tar.gz" \
            -C upstream/dist/build/uBlock0.chromium .

          cp upstream/dist/build/uBlock0.chromium.zip \
            "$RUNNER_TEMP/ublock-artifact/uBlock0.chromium.zip"

          cp "$RUNNER_TEMP/version.txt" \
            "$RUNNER_TEMP/ublock-artifact/version.txt"

          cp "$RUNNER_TEMP/source-sha.txt" \
            "$RUNNER_TEMP/ublock-artifact/source-sha.txt"

      - name: Upload unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ublock-stable-build
          path: ${{ runner.temp }}/ublock-artifact/*
          if-no-files-found: error
          retention-days: 7

  sign_and_publish:
    name: Sign and publish CRX
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ublock-stable-build
          path: package

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install CRX3 packager
        run: npm install --global crx3@2.0.0

      - name: Create and verify signed CRX3
        env:
          UBLOCK_SIGNING_KEY_B64: ${{ secrets.UBLOCK_SIGNING_KEY_B64 }}
          EXPECTED_EXTENSION_ID: ioadkgmoekakepbdfldgeckpiplpgkmj
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${UBLOCK_SIGNING_KEY_B64:-}" ]]; then
            echo "::error::Signing secret is missing."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/ublock-signing.pem"
          EXT_DIR="$RUNNER_TEMP/extension"
          OUT_DIR="$RUNNER_TEMP/release-files"

          cleanup() {
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT

          printf '%s' "$UBLOCK_SIGNING_KEY_B64" \
            | base64 --decode > "$KEY_FILE"

          unset UBLOCK_SIGNING_KEY_B64
          chmod 600 "$KEY_FILE"

          openssl pkey -in "$KEY_FILE" -noout

          mkdir -p "$EXT_DIR" "$OUT_DIR"

          tar -xzf package/extension.tar.gz -C "$EXT_DIR"

          VERSION="$(cat package/version.txt)"
          SOURCE_SHA="$(cat package/source-sha.txt)"

          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Build version mismatch."
            exit 1
          fi

          CRX_FILE="$OUT_DIR/uBlock0_${VERSION}.chromium.crx"
          ZIP_FILE="$OUT_DIR/uBlock0_${VERSION}.chromium.zip"

          crx3 \
            --key "$KEY_FILE" \
            --crx "$CRX_FILE" \
            "$EXT_DIR"

          cp package/uBlock0.chromium.zip "$ZIP_FILE"

          python3 - "$KEY_FILE" "$CRX_FILE" \
            "$EXPECTED_EXTENSION_ID" <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys

          key_path, crx_path, expected_id = sys.argv[1:]
          data = pathlib.Path(crx_path).read_bytes()

          if len(data) < 12 or data[:4] != b"Cr24":
              raise SystemExit("Invalid CRX header")

          version = int.from_bytes(data[4:8], "little")
          header_size = int.from_bytes(data[8:12], "little")
          zip_offset = 12 + header_size

          if version != 3:
              raise SystemExit("Expected CRX3")

          if data[zip_offset:zip_offset + 4] != b"PK\x03\x04":
              raise SystemExit("ZIP payload missing")

          public_der = subprocess.check_output([
              "openssl", "pkey",
              "-in", key_path,
              "-pubout",
              "-outform", "DER"
          ])

          digest = hashlib.sha256(public_der).digest()[:16]

          actual_id = "".join(
              chr(ord("a") + nibble)
              for byte in digest
              for nibble in (byte >> 4, byte & 15)
          )

          print(f"Extension ID: {actual_id}")

          if actual_id != expected_id:
              raise SystemExit("Extension ID mismatch!")

          print("CRX3 and extension ID verified.")
          PY

          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Personal signed Chromium build of uBlock Origin.

          Upstream: https://github.com/gorhill/uBlock
          Upstream version: ${{ needs.prepare.outputs.version }}
          Source commit: ${{ env.UPSTREAM_SHA }}

          Extension ID: ioadkgmoekakepbdfldgeckpiplpgkmj

          This is an independently signed build, not an official upstream binary.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="uBlock-${VERSION}"

          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-files/uBlock0_${VERSION}.chromium.crx" \
            "$RUNNER_TEMP/release-files/uBlock0_${VERSION}.chromium.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "uBlock Origin ${VERSION} — signed build" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
